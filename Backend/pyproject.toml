[project]
name = "cight-browser-backend"
version = "0.1.0"
description = "CIGHT-BROWSER: AI-driven, voice-only web browser backend for blind and low-vision users"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Muhammad Affan", email = "muhammadaffan3355@gmail.com" },
    { name = "Muhammad Muhad" },
    { name = "CIGHT Team Member 3" },
    { name = "CIGHT Team Member 4" },
]
dependencies = [
    "django>=5.1,<6",
    "channels>=4.1",
    "channels-redis",
    "daphne",
    "celery[redis]>=5.4",
    "psycopg[binary]>=3.2",
    "django-environ",
    "pydantic>=2.9",
    "browser-use==0.13.14",
    "google-genai",
    "structlog",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-django",
    "pytest-asyncio",
    "factory-boy",
    "ruff",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "cight.settings"
python_files = ["test_*.py", "*_test.py"]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

